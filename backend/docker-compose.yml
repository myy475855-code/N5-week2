services:
  db:
    image: postgres:15
    container_name: talentbridge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: talentbridge
      POSTGRES_PASSWORD: talentbridge
      POSTGRES_DB: talentbridge
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
